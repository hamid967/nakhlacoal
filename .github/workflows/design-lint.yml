name: Design System Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  design-lint:
    name: Block forbidden tokens (colors / fonts / spacing)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Run design-system lint
        id: lint
        run: bun run lint:design
        continue-on-error: false
      - name: Upload grouped violation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-lint-summary
          path: reports/design-lint/
          if-no-files-found: ignore
          retention-days: 30
