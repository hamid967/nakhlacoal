name: Navigation tests

on:
  push:
    paths:
      - 'src/components/LuxNav.tsx'
      - 'src/components/__tests__/**'
      - 'src/index.css'
      - 'package.json'
      - '.github/workflows/nav-tests.yml'
  pull_request:
    paths:
      - 'src/components/LuxNav.tsx'
      - 'src/components/__tests__/**'
      - 'src/index.css'
      - 'package.json'
      - '.github/workflows/nav-tests.yml'
  workflow_dispatch:

jobs:
  nav-tests:
    name: NavLink is-active / aria-current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run navigation tests
        run: bun run test:nav -- --reporter=verbose
